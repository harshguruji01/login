  <!-- Authentication Logic & Typewriter Engine -->
  <script type="module">
    import { signIn, signUp, signInWithGoogle, getSession, signInWithPhone, verifyPhoneOtp } from './js/auth.js';

    // Quote content definitions matching 21st AuthUI
    const quotes = {
      signIn: {
        image: "https://cdn.21st.dev/assets/mirror/39/39e7b0edd6a7156713d08ec970769bf29360427d3dc8523ee32079885ccca5dd.png",
        text: "Welcome Back! The journey continues.",
        author: "EaseMize UI"
      },
      signUp: {
        image: "https://cdn.21st.dev/assets/mirror/c7/c7cb3a073970aa03472c652391db88fbbe39f1e33c8deb336a9c8e53b039ee01.png",
        text: "Create an account. A new chapter awaits.",
        author: "EaseMize UI"
      }
    };

    // State
    let isSignIn = true;
    let loginMethod = 'email'; // 'email' | 'phone' | 'verify'
    let pendingPhone = '';
    let typewriterTimer = null;

    // DOM Elements
    const form = document.getElementById('auth-form');
    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const nameGroup = document.getElementById('name-group');
    const nameInput = document.getElementById('name');
    const emailGroup = document.getElementById('email-group');
    const emailInput = document.getElementById('email');
    const phoneGroup = document.getElementById('phone-group');
    const phoneInput = document.getElementById('phone');
    const passwordGroup = document.getElementById('password-group');
    const passwordInput = document.getElementById('password');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const otpGroup = document.getElementById('otp-group');
    const otpInput = document.getElementById('otp');
    const submitBtn = document.getElementById('submit-btn');
    const submitBtnText = document.getElementById('submit-btn-text');
    const submitSpinner = document.getElementById('submit-spinner');
    const toggleAuthBtn = document.getElementById('toggle-auth-btn');
    const togglePrompt = document.getElementById('toggle-prompt');
    const toggleMethodBtn = document.getElementById('toggle-method-btn');
    const googleBtn = document.getElementById('google-login-btn');
    const errorDiv = document.getElementById('auth-error');
    const successDiv = document.getElementById('auth-success');
    const visualPane = document.getElementById('auth-visual-pane');
    const typewriterEl = document.getElementById('typewriter-text');
    const quoteAuthorEl = document.getElementById('quote-author');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');

    // Typewriter engine
    function renderTypewriter(text, speed = 60) {
      if (typewriterTimer) clearTimeout(typewriterTimer);
      typewriterEl.textContent = "";
      let i = 0;
      function tick() {
        if (i < text.length) {
          typewriterEl.textContent += text[i];
          i++;
          typewriterTimer = setTimeout(tick, speed);
        }
      }
      tick();
    }

    // Toggle between Sign In and Sign Up modes
    function setAuthMode(signInMode) {
      isSignIn = signInMode;
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      const content = isSignIn ? quotes.signIn : quotes.signUp;
      if (visualPane) {
        visualPane.style.backgroundImage = `url('${content.image}')`;
      }
      if (quoteAuthorEl) {
        quoteAuthorEl.textContent = `— ${content.author}`;
      }
      renderTypewriter(content.text, 50);

      if (isSignIn) {
        formTitle.textContent = "Sign in to your account";
        formSubtitle.textContent = "Enter your email below to sign in";
        nameGroup.classList.add('hidden');
        nameInput.required = false;
        forgotPasswordLink.classList.remove('hidden');
        submitBtnText.textContent = "Sign In";
        togglePrompt.textContent = "Don't have an account?";
        toggleAuthBtn.textContent = "Sign up";
        passwordInput.autocomplete = "current-password";
      } else {
        formTitle.textContent = "Create an account";
        formSubtitle.textContent = "Enter your details below to sign up";
        nameGroup.classList.remove('hidden');
        nameInput.required = true;
        forgotPasswordLink.classList.add('hidden');
        submitBtnText.textContent = "Sign Up";
        togglePrompt.textContent = "Already have an account?";
        toggleAuthBtn.textContent = "Sign in";
        passwordInput.autocomplete = "new-password";
      }

      // Reset to email mode if was on phone
      if (loginMethod !== 'email') {
        loginMethod = 'email';
        phoneGroup.classList.add('hidden');
        phoneInput.required = false;
        otpGroup.classList.add('hidden');
        otpInput.required = false;
        emailGroup.classList.remove('hidden');
        passwordGroup.classList.remove('hidden');
        toggleMethodBtn.textContent = "Sign in with Phone (OTP) instead";
      }
    }

    toggleAuthBtn.addEventListener('click', () => {
      setAuthMode(!isSignIn);
    });

    // Password visibility toggle
    let showPassword = false;
    togglePasswordBtn.addEventListener('click', () => {
      showPassword = !showPassword;
      passwordInput.type = showPassword ? 'text' : 'password';
      if (showPassword) {
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
      } else {
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
      }
    });

    // Toggle email vs phone OTP
    toggleMethodBtn.addEventListener('click', () => {
      errorDiv.classList.add('hidden');
      if (loginMethod === 'email') {
        loginMethod = 'phone';
        emailGroup.classList.add('hidden');
        passwordGroup.classList.add('hidden');
        nameGroup.classList.add('hidden');
        phoneGroup.classList.remove('hidden');
        phoneInput.required = true;
        toggleMethodBtn.textContent = "Sign in with Email instead";
        submitBtnText.textContent = "Send OTP";
      } else {
        loginMethod = 'email';
        phoneGroup.classList.add('hidden');
        phoneInput.required = false;
        otpGroup.classList.add('hidden');
        otpInput.required = false;
        emailGroup.classList.remove('hidden');
        passwordGroup.classList.remove('hidden');
        if (!isSignIn) nameGroup.classList.remove('hidden');
        toggleMethodBtn.textContent = "Sign in with Phone (OTP) instead";
        submitBtnText.textContent = isSignIn ? "Sign In" : "Sign Up";
        pendingPhone = '';
      }
    });

    // Destination redirect computation
    function getAuthRedirectTarget() {
      try {
        const params = new URLSearchParams(window.location.search);
        let target = params.get('redirect') || params.get('return_to') || '';

        if (!target) {
          const cookieMatch = document.cookie.match(/(?:^|;\s*)hg_auth_redirect=([^;]+)/);
          if (cookieMatch) target = decodeURIComponent(cookieMatch[1]);
        }
        if (!target) {
          target = sessionStorage.getItem('hg_auth_redirect') || '';
        }
        const source = params.get('source') || params.get('from') || '';
        if (source === 'ai' || source === 'guruai' || source.includes('ai')) {
          target = 'https://ai.webguruji.online/';
        }
        if (!target && document.referrer) {
          if (document.referrer.includes('ai.webguruji.online') || document.referrer.includes('/ai')) {
            target = 'https://ai.webguruji.online/';
          }
        }
        if (target) {
          try { target = decodeURIComponent(target); } catch(e){}
        }
        if (!target || target === 'login.html' || target.includes('/login.html') || target.includes('/signup.html')) {
          target = 'https://webguruji.online/dashboard.html';
        }
        return target;
      } catch(e) {
        return 'https://webguruji.online/dashboard.html';
      }
    }

    let redirectUrl = getAuthRedirectTarget();

    try {
      if (redirectUrl && !redirectUrl.includes('login.html')) {
        sessionStorage.setItem('hg_auth_redirect', redirectUrl);
        const hostname = window.location.hostname;
        let domainStr = (hostname === 'webguruji.online' || hostname.endsWith('.webguruji.online')) ? '; domain=.webguruji.online' : '';
        const secureStr = window.location.protocol === 'https:' ? '; secure' : '';
        document.cookie = `hg_auth_redirect=${encodeURIComponent(redirectUrl)}; path=/; max-age=3600${domainStr}; SameSite=Lax${secureStr}`;
      }
    } catch (e) {}

    // Check if initial URL asks for signup mode
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'signup' || window.location.pathname.includes('signup')) {
      setAuthMode(false);
    } else {
      setAuthMode(true);
    }

    // Background session verification
    async function checkExistingSession() {
      try {
        const forceStay = urlParams.get('logout') || urlParams.get('reauth') || urlParams.get('force');
        if (!forceStay) {
          const session = await getSession();
          if (session && session.user) {
            redirectUrl = getAuthRedirectTarget();
            try { sessionStorage.removeItem('hg_auth_redirect'); } catch(e){}
            let finalTarget = redirectUrl;
            if (session.access_token && session.refresh_token) {
              const hashStr = `#access_token=${encodeURIComponent(session.access_token)}&refresh_token=${encodeURIComponent(session.refresh_token)}&token_type=bearer`;
              finalTarget = finalTarget.split('#')[0] + hashStr;
            }
            window.location.replace(finalTarget);
          }
        }
      } catch(err) {
        console.warn("Session check:", err);
      }
    }
    checkExistingSession();

    // Google Sign In
    googleBtn.addEventListener('click', async () => {
      try {
        errorDiv.classList.add('hidden');
        googleBtn.disabled = true;
        googleBtn.style.opacity = '0.7';
        redirectUrl = getAuthRedirectTarget();
        if (redirectUrl) {
          sessionStorage.setItem('hg_auth_redirect', redirectUrl);
        }
        await signInWithGoogle();
      } catch (err) {
        errorDiv.textContent = 'Google sign-in failed: ' + err.message;
        errorDiv.classList.remove('hidden');
        googleBtn.disabled = false;
        googleBtn.style.opacity = '1';
      }
    });

    // Form Submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');
      submitBtn.disabled = true;
      submitSpinner.classList.remove('hidden');
      submitBtnText.classList.add('hidden');

      try {
        if (loginMethod === 'email') {
          const email = (emailInput.value || '').trim();
          const password = passwordInput.value;

          if (isSignIn) {
            // Sign In
            await signIn(email, password);
            redirectUrl = getAuthRedirectTarget();
            const { data: { session } } = await supabase.auth.getSession();
            try {
              sessionStorage.removeItem('hg_auth_redirect');
              const hostname = window.location.hostname;
              let domainStr = (hostname === 'webguruji.online' || hostname.endsWith('.webguruji.online')) ? '; domain=.webguruji.online' : '';
              document.cookie = `hg_auth_redirect=; path=/; max-age=0${domainStr}; SameSite=Lax`;
            } catch(e){}
            let finalTarget = redirectUrl;
            if (session && session.access_token && session.refresh_token) {
              const hashStr = `#access_token=${encodeURIComponent(session.access_token)}&refresh_token=${encodeURIComponent(session.refresh_token)}&token_type=bearer`;
              finalTarget = finalTarget.split('#')[0] + hashStr;
            }
            window.location.replace(finalTarget);
          } else {
            // Sign Up
            const name = (nameInput.value || '').trim();
            const result = await signUp(email, password, name);
            if (result?.user?.identities && result.user.identities.length === 0) {
              throw new Error("This email is already registered. Please sign in instead.");
            }
            successDiv.textContent = "Account created successfully! You are now logged in.";
            successDiv.classList.remove('hidden');
            setTimeout(async () => {
              redirectUrl = getAuthRedirectTarget();
              const { data: { session } } = await supabase.auth.getSession();
              try {
                sessionStorage.removeItem('hg_auth_redirect');
                const hostname = window.location.hostname;
                let domainStr = (hostname === 'webguruji.online' || hostname.endsWith('.webguruji.online')) ? '; domain=.webguruji.online' : '';
                document.cookie = 'hg_auth_redirect=; path=/; max-age=0' + domainStr + '; SameSite=Lax';
              } catch(e){}
              let finalTarget = redirectUrl;
              if (session && session.access_token && session.refresh_token) {
                const hashStr = '#access_token=' + encodeURIComponent(session.access_token) + '&refresh_token=' + encodeURIComponent(session.refresh_token) + '&token_type=bearer';
                finalTarget = finalTarget.split('#')[0] + hashStr;
              }
              window.location.replace(finalTarget);
            }, 1200);
          }

        } else if (loginMethod === 'phone') {
          // Send Phone OTP
          const phone = (phoneInput.value || '').trim();
          if (!phone) throw new Error("Phone number is required.");
          await signInWithPhone(phone);
          pendingPhone = phone;
          loginMethod = 'verify';
          phoneGroup.classList.add('hidden');
          otpGroup.classList.remove('hidden');
          otpInput.required = true;
          submitBtnText.textContent = "Verify OTP";
          toggleMethodBtn.textContent = "Change Phone Number";
          successDiv.textContent = "OTP sent successfully! Please check your messages.";
          successDiv.classList.remove('hidden');

        } else if (loginMethod === 'verify') {
          // Verify Phone OTP
          const otp = (otpInput.value || '').trim();
          if (!otp) throw new Error("Verification OTP is required.");
          await verifyPhoneOtp(pendingPhone, otp);
          redirectUrl = getAuthRedirectTarget();
          const { data: { session } } = await supabase.auth.getSession();
          try {
            sessionStorage.removeItem('hg_auth_redirect');
            const hostname = window.location.hostname;
            let domainStr = (hostname === 'webguruji.online' || hostname.endsWith('.webguruji.online')) ? '; domain=.webguruji.online' : '';
            document.cookie = `hg_auth_redirect=; path=/; max-age=0${domainStr}; SameSite=Lax`;
          } catch(e){}
          let finalTarget = redirectUrl;
          if (session && session.access_token && session.refresh_token) {
            const hashStr = `#access_token=${encodeURIComponent(session.access_token)}&refresh_token=${encodeURIComponent(session.refresh_token)}&token_type=bearer`;
            finalTarget = finalTarget.split('#')[0] + hashStr;
          }
          window.location.replace(finalTarget);
        }
      } catch (err) {
        errorDiv.textContent = err.message || "Authentication failed. Please try again.";
        errorDiv.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitSpinner.classList.add('hidden');
        submitBtnText.classList.remove('hidden');
      }
    });
  </script>
  <script src="loading-lines.js" defer></script>
</body>
</html>
